version: '3.8'
services:
  rescue-mqtt:
    build: .
    container_name: rescue-mqtt
    command: ["python", "mqtt_service.py"]
    environment:
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_TOPIC=${MQTT_TOPIC}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID}
      - MQTT_KEEP_ALIVE=${MQTT_KEEP_ALIVE}
      - MQTT_TRANSPORT=${MQTT_TRANSPORT}
      - MQTT_WS_PATH=${MQTT_WS_PATH}
      - MQTT_TLS=${MQTT_TLS}
      - BACKEND_URL=${BACKEND_URL}
      - BACKEND_API_KEY=${BACKEND_API_KEY}
      - BACKEND_INTERNAL_TOKEN_HEADER=${BACKEND_INTERNAL_TOKEN_HEADER:-X-Internal-Token}
      - BACKEND_TIMEOUT=${BACKEND_TIMEOUT}
      - BACKEND_RETRY_ATTEMPTS=${BACKEND_RETRY_ATTEMPTS}
      - BACKEND_RETRY_DELAY=${BACKEND_RETRY_DELAY}
      # Throttle de vida del hardware: 1 refresco de physical-status por dispositivo
      # cada N segundos (umbral de inactividad del backend = 600s).
      - HARDWARE_STATUS_REFRESH_SECONDS=${HARDWARE_STATUS_REFRESH_SECONDS:-45}
      # Tipos sin estado de vida (no son hardware físico). PANTALLA solo muestra.
      - HARDWARE_STATUS_EXCLUDED_TYPES=${HARDWARE_STATUS_EXCLUDED_TYPES:-PANTALLA}
      - WHATSAPP_API_URL=${WHATSAPP_API_URL}
      - WHATSAPP_API_TIMEOUT=${WHATSAPP_API_TIMEOUT}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_MAX_CONNECTIONS=${REDIS_MAX_CONNECTIONS}
      - WHATSAPP_QUEUE_NAME=${WHATSAPP_QUEUE_NAME}
      - WHATSAPP_WORKERS=${WHATSAPP_WORKERS}
      - WHATSAPP_QUEUE_TTL=${WHATSAPP_QUEUE_TTL}
      - LOG_LEVEL=${LOG_LEVEL}
      - MESSAGE_INTERVAL=${MESSAGE_INTERVAL}
    volumes:
      - ./logs:/app/logs
    networks:
      - global-network
      - rescue-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
  rescue-websocket:
    build: .
    container_name: rescue-websocket
    command: ["python", "websocket_service.py"]
    # El navegador del Next local necesita alcanzar el canal realtime. El puerto
    # HTTP interno 8081 permanece accesible solo entre contenedores.
    ports:
      - "${WEBSOCKET_BIND_ADDRESS:-127.0.0.1}:${WEBSOCKET_HOST_PORT:-8081}:8080"
    expose:
      - "8081"
    environment:
      # MQTT: este servicio publica a los semáforos/pantallas en las alertas de
      # web y WhatsApp. Sin estas variables caía al .env horneado en la imagen y
      # publicaba a un broker equivocado sin reportar error.
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_TOPIC=${MQTT_TOPIC}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID}
      - MQTT_KEEP_ALIVE=${MQTT_KEEP_ALIVE}
      - MQTT_TRANSPORT=${MQTT_TRANSPORT}
      - MQTT_WS_PATH=${MQTT_WS_PATH}
      - MQTT_TLS=${MQTT_TLS}
      - INTERNAL_HTTP_PORT=${INTERNAL_HTTP_PORT}
      - WEBSOCKET_HOST=${WEBSOCKET_HOST}
      - WEBSOCKET_PORT=${WEBSOCKET_PORT}
      - WEBSOCKET_PING_INTERVAL=${WEBSOCKET_PING_INTERVAL}
      - WEBSOCKET_PING_TIMEOUT=${WEBSOCKET_PING_TIMEOUT}
      - BACKEND_URL=${BACKEND_URL}
      - BACKEND_API_KEY=${BACKEND_API_KEY}
      - BACKEND_INTERNAL_TOKEN_HEADER=${BACKEND_INTERNAL_TOKEN_HEADER:-X-Internal-Token}
      - BACKEND_TIMEOUT=${BACKEND_TIMEOUT}
      - HARDWARE_STATUS_SWEEP_INTERVAL=${HARDWARE_STATUS_SWEEP_INTERVAL:-30}
      - WHATSAPP_API_URL=${WHATSAPP_API_URL}
      - WHATSAPP_API_TIMEOUT=${WHATSAPP_API_TIMEOUT}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - WHATSAPP_QUEUE_NAME=${WHATSAPP_QUEUE_NAME}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./logs:/app/logs
    networks:
      - global-network
      - rescue-network
    restart: unless-stopped
    healthcheck:
      # /health responde 503 si ningún publisher MQTT está conectado:
      # el fallo lo detecta el orquestador, no un usuario en una emergencia.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
networks:
  global-network:
    external: true
  rescue-network:
    external: true
